apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ontos-ingress
  namespace: ontos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ontos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ontos-app
                port:
                  number: 8000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ontos-app
                port:
                  number: 8000
